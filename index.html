<html>
	<head>
		<meta charset="utf-8" />
		<title>A Particular Test</title>
		<link rel="stylesheet" href="style.css" />
		<script src="pixi3.min.js"></script>
		<script src="main.js"></script>
	</head>
	<body>
		<div id="app">
			<div id="canvas-container"></div>
			<div class="buttons">
				<button class="btn" id="win-btn">Win</button>
				<button class="btn" id="play-btn">Pause</button>
			</div>
			<div class="slider-group">
				<label for="spread-slider">Spread</label>
				<input
					id="spread-slider"
					type="range"
					min="100"
					max="4000"
					value="2000"
				/>
				<label for="towards-screen-slider">Towards screen</label>
				<input
					id="towards-screen-slider"
					type="range"
					min="0"
					max="3"
					value="0.2"
					step="0.05"
				/>
				<label for="depth-slider">Depth</label>
				<input
					id="depth-slider"
					type="range"
					min="0.1"
					max="0.6"
					value="0.4"
					step="0.05"
				/>
			</div>
		</div>
	</body>
</html>
